<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comunicador Personalizado</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Iconos -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fce7f3; /* Fondo rosa muy suave */
            touch-action: manipulation;
        }
        .btn-speak {
            transition: all 0.1s;
            user-select: none;
        }
        .btn-speak:active {
            transform: scale(0.95);
            background-color: #fbcfe8; /* Rosa más oscuro al presionar */
        }
        .playing {
            border-color: #db2777 !important; /* Rosa fuerte */
            background-color: #fdf2f8 !important;
            box-shadow: 0 0 15px rgba(219, 39, 119, 0.5);
            transform: scale(0.98);
        }
        /* Estilo para el slider de volumen */
        input[type=range] {
            accent-color: #db2777; /* Color rosa fuerte */
        }
    </style>
</head>
<body class="pb-10">

    <header class="bg-pink-600 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i data-lucide="heart"></i>
                Para Almita:3
            </h1>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 space-y-6">

        <!-- Panel de Estado / Reproductor / Volumen -->
        <div class="bg-white p-3 rounded-xl shadow-sm border border-pink-200 sticky top-20 z-40 space-y-3">
            
            <!-- Fila Superior: Estado y Stop -->
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div id="status-icon" class="w-3 h-3 rounded-full bg-green-500"></div>
                    <span id="status-text" class="text-gray-600 font-medium text-sm md:text-base">Escucha: </span>
                </div>
                <button onclick="stopAudio()" class="text-xs md:text-sm text-red-500 font-bold border border-red-200 px-3 py-1 rounded-full hover:bg-red-50 flex items-center gap-1 transition-colors">
                    <i data-lucide="square" class="w-3 h-3 fill-current"></i> Stop
                </button>
            </div>

            <!-- Fila Inferior: Control de Volumen -->
            <div class="flex items-center gap-3 bg-pink-50 p-2 rounded-lg">
                <i data-lucide="volume-2" class="w-5 h-5 text-pink-600"></i>
                <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="1" 
                       class="w-full h-2 bg-pink-200 rounded-lg appearance-none cursor-pointer">
            </div>

        </div>

        <!-- Contenedor único (Grid) -->
        <div id="grid-container" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
            <!-- Los botones se generarán aquí automáticamente -->
        </div>

    </main>

    <script>
        // --- CONFIGURACIÓN DE TUS AUDIOS ---
        // Lista idéntica a la que tenías
        
        const phrases = [
            { label: "Muua", file: "audios/muua.mp3" },
            { label: "Holis Cara De Bolis", file: "audios/holiscaradebolis.mp3" },
            { label: "Hola Cara De Bola", file: "audios/holacaradebola.mp3" },
            { label: "Chi", file: "audios/chi.mp3" },
            { label: "Sipi", file: "audios/sipi.mp3" },
            { label: "Okis", file: "audios/okis.mp3" },
            { label: "Nop", file: "audios/nop.mp3" },
            { label: "Chinga A Tu Suerte", file: "audios/chiatusuerte.mp3" },
            { label: "Provecho", file: "audios/provecho.mp3" },
            { label: "Mmmm", file: "audios/mmmm.mp3" },
            { label: "Mmmm Con Duda", file: "audios/mmmmconDuda.mp3" },
            { label: "Mmmm Con Más Duda", file: "audios/mmmmconMasDuda.mp3" },
            { label: "Gracias", file: "audios/gracias.mp3" },
            { label: "No Seas Mamón", file: "audios/noseasmamon.mp3" },
            { label: "Jaja Nmms", file: "audios/jajajanmms.mp3" },
            { label: "Te Amo Muchisimo", file: "audios/teamomucisi.mp3" },
            { label: "Ash Olvidalo", file: "audios/ashOlvidalo.mp3" },
            { label: "No Nada", file: "audios/noNada.mp3" },
            { label: "Una Preguntota Que Haces", file: "audios/unapreguntotaquehaces.mp3" },
            { label: "Oye", file: "audios/oyee.mp3" },
            { label: "Mmm Te Vamos A Creer", file: "audios/mmmtevamosacreer.mp3" },
            { label: "No Puedo Preguntar", file: "audios/nopuedopreguntar.mp3" },
            { label: "Que Rico", file: "audios/querico.mp3" },
            { label: "Mmm Perdón", file: "audios/mmmperdon.mp3" },
            { label: "Que Pacho?", file: "audios/quepacho.mp3" },
            { label: "Pues Que Chido No", file: "audios/puesquechidono.mp3" },
            { label: "Ash Deveras Contigo", file: "audios/ashdeverascontigo.mp3" },
            { label: "Sale Cuídate", file: "audios/Salecuidate.mp3" },
            { label: "123 Adios", file: "audios/123adios.mp3" },
            { label: "Se Pasa La Alexa", file: "audios/SepasalaAlexa.mp3" },
            { label: "Ntp En Serio", file: "audios/NtpEnserio.mp3" },
            { label: "Como Diría Dafne:", file: "audios/ComodiriaDafne.mp3" },
            { label: "Por Que Estás En Línea", file: "audios/Porqueestasenlinea.mp3" },
            { label: "Y Te Ries", file: "audios/yteries.mp3" }
        ];

        // --- SISTEMA DE AUDIO ---
        
        let currentAudio = null;
        let globalVolume = 1.0; // Variable para guardar el nivel de volumen (1.0 es el máximo)
        
        const statusText = document.getElementById('status-text');
        const statusIcon = document.getElementById('status-icon');
        const volumeSlider = document.getElementById('volume-slider');

        // Escuchar cambios en el slider de volumen
        volumeSlider.addEventListener('input', function(e) {
            globalVolume = e.target.value;
            // Si hay un audio sonando, le ajustamos el volumen en tiempo real
            if (currentAudio) {
                currentAudio.volume = globalVolume;
            }
        });

        function playAudio(filePath, btnElement = null) {
            stopAudio(); // Detener anterior

            currentAudio = new Audio(filePath);
            
            // APLICAR VOLUMEN ACTUAL
            currentAudio.volume = globalVolume;
            
            // UI Update
            statusText.innerText = "Reproduciendo...";
            statusIcon.className = "w-3 h-3 rounded-full bg-pink-500 animate-pulse";
            if(btnElement) btnElement.classList.add('playing');

            // Error Handling
            currentAudio.onerror = function() {
                statusText.innerText = "Error: Falta archivo";
                statusIcon.className = "w-3 h-3 rounded-full bg-red-500";
                console.log(`Falta el archivo: ${filePath}`);
                if(btnElement) btnElement.classList.remove('playing');
            };

            // On Ended
            currentAudio.onended = function() {
                resetUI(btnElement);
            };

            // Play
            currentAudio.play().catch(e => {
                console.error(e);
                statusText.innerText = "Error de reproducción";
            });
        }

        function stopAudio() {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                currentAudio = null;
            }
            document.querySelectorAll('.btn-speak').forEach(b => b.classList.remove('playing'));
            resetUI();
        }

        function resetUI(btnElement) {
            statusText.innerText = "Lista para el chisme";
            statusIcon.className = "w-3 h-3 rounded-full bg-green-500";
            if(btnElement) btnElement.classList.remove('playing');
        }

        // --- GENERADOR DE INTERFAZ (LISTA PLANA) ---

        function renderInterface() {
            const container = document.getElementById('grid-container');

            phrases.forEach(item => {
                const btn = document.createElement('button');
                // Diseño de botón limpio y grande
                btn.className = 'btn-speak bg-white hover:bg-pink-50 border border-pink-200 rounded-xl p-2 text-center shadow-sm hover:shadow-md h-24 flex flex-col items-center justify-center gap-1 relative overflow-hidden';
                
                btn.innerHTML = `
                    <span class="font-bold text-gray-800 text-lg leading-tight px-1 z-10">${item.label}</span>
                    <span class="text-[9px] text-gray-400 absolute bottom-1 w-full text-center opacity-60">${item.file.replace('audios/', '')}</span>
                `;
                
                btn.onclick = () => playAudio(item.file, btn);
                container.appendChild(btn);
            });
            
            lucide.createIcons();
        }

        renderInterface();
    </script>
</body>
</html>
